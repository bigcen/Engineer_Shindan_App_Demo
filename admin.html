<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面：参加者一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap">
<link rel="stylesheet" href="style.css?v=5">
<script src="config.js"></script>
<style>
/* 管理画面のワイド表示。style.cssが古いキャッシュのままでも幅が狭くならないよう、admin.html側にも持たせる。 */
.app-shell.admin-shell { max-width: 1680px; width: 100%; padding-left: 24px; padding-right: 24px; }
.detail-grid { display: block; }
.admin-nav { display:flex; gap:12px; align-items:center; margin-left:auto; }
.admin-nav a { font-size: var(--fs-2); font-weight:700; color: var(--color-primary-600); text-decoration:none;
  background: var(--color-primary-50); padding: 6px 14px; border-radius: 999px; }
@media (min-width: 1100px) {
  .app-shell.admin-shell { --fs-1:14px; --fs-2:16px; --fs-3:18px; --fs-4:20px; --fs-5:24px; --fs-6:30px; --fs-7:34px; --fs-8:42px; }
  .app-shell.admin-shell .admin-layout { grid-template-columns: 400px 1fr; gap: 32px; }
  .app-shell.admin-shell .list-card { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .app-shell.admin-shell .list-row { padding: 16px 24px; }
  .app-shell.admin-shell .list-row .thumb { width: 56px; height: 56px; }
  .app-shell.admin-shell .list-row .emoji { font-size: 40px; }
  .app-shell.admin-shell .card { padding: 32px; }
  .detail-grid { display: grid; grid-template-columns: minmax(380px, 5fr) minmax(420px, 6fr); gap: 48px; align-items: start; }
  .detail-col-rank .section-title:first-child { margin-top: 0; }
  .detail-hero-img img { max-height: 560px; }
  .detail-comment { font-size: var(--fs-3); line-height: 1.75; }
}
</style>
</head>
<body>
  <div class="app-shell admin-shell">
    <div class="app-header">
      <span class="material-symbols-rounded">monitoring</span>
      <span>管理画面：参加者一覧</span>
      <span class="admin-nav"><a href="team.html" target="_blank" rel="noopener">チームルームを見る</a><span class="badge" id="countBadge">0名</span></span>
    </div>

    <div class="admin-layout">
      <div class="card list-card">
        <div id="listArea"><div class="empty-state">読み込み中...</div></div>
      </div>
      <div class="card" id="detailArea">
        <div class="empty-state">
          <span class="material-symbols-rounded" style="font-size:40px;">touch_app</span>
          <p>左の一覧から参加者を選択してください</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ★ここをGASのウェブアプリURL（.../exec）に書き換えてください（index.htmlと同じ値）★
    var GAS_API_URL = (window.APP_CONFIG && window.APP_CONFIG.GAS_API_URL) || 'https://script.google.com/macros/s/AKfycbzTXakRT4pGZml7ieK92eAlh-xKYO5KehfLhHWnKgYFq3Y-uLMniD3NlEIYhHtgiTB4/exec';
    var POLL_INTERVAL_MS = 5000;

    var results = [];
    var selectedUserId = null;
    var pollTimer = null;

    // このURL・コードはGitHub上で公開されている前提のため、管理キーはコードに埋め込まず、
    // ブラウザでその場で入力してもらい、このブラウザのlocalStorageにだけ保存する
    // （ページのソースを見られても管理キーの値自体は漏れない）。
    function getStoredAdminKey() {
      return localStorage.getItem('admin_key') || '';
    }

    function promptForAdminKey() {
      var key = window.prompt('管理キーを入力してください（GAS側のスクリプトプロパティ ADMIN_KEY と同じ値）');
      if (key) localStorage.setItem('admin_key', key);
      return key || '';
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      refresh();
      pollTimer = setInterval(refresh, POLL_INTERVAL_MS);
    }

    async function refresh() {
      try {
        var key = getStoredAdminKey();
        // 単純なGETリクエストなのでCORSプリフライトは発生しない。
        var res = await fetch(GAS_API_URL + '?action=results&key=' + encodeURIComponent(key));
        var json = await res.json();
        if (!json.ok) {
          if (json.code === 'UNAUTHORIZED') {
            handleUnauthorized();
            return;
          }
          throw new Error(json.error || 'サーバーエラーが発生しました');
        }
        results = Array.isArray(json.data) ? json.data : [];
        renderList();
        if (selectedUserId) renderDetail(selectedUserId);
      } catch (err) {
        console.error('データ取得失敗:', err);
      }
    }

    function handleUnauthorized() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      localStorage.removeItem('admin_key');
      var key = promptForAdminKey();
      if (key) {
        startPolling();
      } else {
        document.getElementById('listArea').innerHTML =
          '<div class="empty-state">管理キーが必要です。<br>ページを再読み込みしてください。</div>';
      }
    }

    function renderList() {
      if (!Array.isArray(results)) results = [];
      document.getElementById('countBadge').textContent = results.length + '名';
      var area = document.getElementById('listArea');

      if (results.length === 0) {
        area.innerHTML = '<div class="empty-state">まだ回答者がいません</div>';
        return;
      }

      area.innerHTML = '';
      results.forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'list-row' + (String(r.userId) === String(selectedUserId) ? ' active' : '');
        row.innerHTML =
          (isSafeImageUrl(r.imageUrl)
            ? '<img class="thumb" src="' + escapeHtml(r.imageUrl) + '">'
            : '<span class="emoji">' + escapeHtml(r.animalEmoji || '❓') + '</span>') +
          '<div class="info">' +
            '<div class="nickname">' + escapeHtml(r.nickname) + '</div>' +
            '<div class="sub">' + escapeHtml(r.topJob || '') + '（' + escapeHtml(r.animalName || '') + '）</div>' +
          '</div>';
        row.addEventListener('click', function () {
          selectedUserId = r.userId;
          renderList();
          renderDetail(r.userId);
        });
        area.appendChild(row);
      });
    }

    function pctRows(obj) {
      if (!obj || typeof obj !== 'object') return '';
      var entries = Object.keys(obj).map(function (key) {
        return { label: key, value: Number(obj[key]) || 0 };
      }).sort(function (a, b) { return b.value - a.value; });

      return entries.map(function (e) {
        return '<div class="pct-row">' +
          '<div class="pct-label">' + escapeHtml(e.label) + '</div>' +
          '<div class="pct-track"><div class="pct-fill" style="width:' + e.value + '%"></div></div>' +
          '<div class="pct-value">' + e.value + '%</div>' +
        '</div>';
      }).join('');
    }

    // 全15職種を同じ尺度（最上位=100の相対スコア）で降順に並べる。
    // 理由コメントはAIにトークン節約のため上位3件しか生成させていないので、4位以降は理由なしで表示する。
    function renderJobRanking(r) {
      var scores = (r.jobRelativeScores && typeof r.jobRelativeScores === 'object') ? r.jobRelativeScores : {};
      var entries = Object.keys(scores).map(function (label) {
        return { label: label, score: Number(scores[label]) || 0 };
      }).sort(function (a, b) { return b.score - a.score; });

      // 旧データ（jobRelativeScoresがまだ無い行）向けのフォールバック
      if (entries.length === 0) {
        entries = [{ label: r.topJob, score: 100 }];
      }

      var reasons = Array.isArray(r.topJobReasons) ? r.topJobReasons : [];

      return entries.map(function (e, i) {
        var isTop3 = i < 3;
        var reasonHtml = (isTop3 && reasons[i]) ? '<div class="top-job-reason">' + escapeHtml(reasons[i]) + '</div>' : '';
        return '<div class="top-job-row' + (isTop3 ? ' is-top3' : '') + '">' +
          '<div class="top-job-head">' +
            '<span class="top-job-rank">' + (i + 1) + '位</span>' +
            '<span class="top-job-name">' + escapeHtml(e.label) + '</span>' +
            '<span class="top-job-score">' + e.score + '</span>' +
          '</div>' +
          '<div class="pct-track"><div class="pct-fill" style="width:' + e.score + '%"></div></div>' +
          reasonHtml +
        '</div>';
      }).join('');
    }

    function renderDetail(userId) {
      var r = (results || []).find(function (x) { return String(x.userId) === String(userId); });
      if (!r) return;
      var area = document.getElementById('detailArea');

      // PC（広い画面）では左右2カラム：左＝画像・コメント・趣味、右＝全15職種ランキング。
      // 狭い画面では縦に積まれる（CSS側のgrid切り替え）。
      area.innerHTML =
        '<div class="detail-grid">' +
          '<div class="detail-col-main">' +
            (isSafeImageUrl(r.imageUrl)
              ? '<div class="detail-hero-img"><img src="' + escapeHtml(r.imageUrl) + '"></div>'
              : '<div class="detail-hero-emoji">' + escapeHtml(r.animalEmoji || '❓') + '</div>') +
            '<div class="detail-info">' +
              '<div class="muted">' + escapeHtml(r.nickname) + 'さん ・ ' + escapeHtml(r.animalName || '') + 'タイプ</div>' +
              '<div class="catchphrase">' + escapeHtml(r.catchphrase || '') + '</div>' +
              '<span class="job-chip">' + escapeHtml(r.topJob || '') + '</span>' +
            '</div>' +
            '<p class="detail-comment">' + escapeHtml(r.personalityComment || '') + '</p>' +

            '<div class="section-title">インドア / アウトドア</div>' +
            pctRows({ 'インドア': r.indoorPct, 'アウトドア': r.outdoorPct }) +

            '<div class="section-title">想定される趣味</div>' +
            '<div class="hobby-tags">' + (r.hobbies || []).map(function (h) {
              return '<span class="hobby-tag">' + escapeHtml(h) + '</span>';
            }).join('') + '</div>' +
          '</div>' +
          '<div class="detail-col-rank">' +
            '<div class="section-title">適性傾向ランキング（全15職種・スコアは最上位を100とした相対値）</div>' +
            renderJobRanking(r) +
          '</div>' +
        '</div>';
    }

    // サーバーが返すimageUrlは本来Googleドライブの画像URLのみだが、
    // 念のためhttps://で始まる文字列以外は信用せず絵文字表示にフォールバックする。
    function isSafeImageUrl(url) {
      return typeof url === 'string' && /^https:\/\//.test(url);
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = String(str == null ? '' : str);
      return div.innerHTML;
    }

    startPolling();
  </script>
</body>
</html>
